<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkVault — URL Shortener</title>
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem('linkvault_theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta name="description" content="Transform long URLs into clean short links with custom aliases, auto-expiry, and real-time analytics. Powered by LinkVault." />

    <!-- Open Graph / Social Media Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LinkVault" />
    <meta property="og:title" content="LinkVault — Shorten Links with Superpowers" />
    <meta property="og:description" content="Transform long URLs into clean short links with custom aliases, auto-expiry, and real-time analytics." />
    <meta property="og:image" content="https://linkvault-mqxy2sew4-alpha-d610.vercel.app/og-image.svg" />
    <meta property="og:url" content="https://linkvault-mqxy2sew4-alpha-d610.vercel.app" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LinkVault — URL Shortener" />
    <meta name="twitter:description" content="Shorten, track and analyze your links in real-time." />
    <meta name="twitter:image" content="https://linkvault-mqxy2sew4-alpha-d610.vercel.app/og-image.svg" />

    <!-- Google Fonts: Poppins (body), Space Grotesk (headings), Sora (LinkVault brand) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
